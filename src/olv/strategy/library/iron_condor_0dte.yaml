name: iron_condor_0dte
description: >
  The baseline with long wings, capping the loss on each side. Defined risk, so
  its max loss is an arithmetic fact rather than a hope - which is why it can be
  sized honestly and the naked strangle cannot. Smaller edge per contract, and
  per Natenberg's second rule that is precisely what permits sizing it up.

params:
  short_put_delta:  {type: float, default: 0.10, min: 0.01, max: 0.50}
  short_call_delta: {type: float, default: 0.10, min: 0.01, max: 0.50}
  wing_width:       {type: float, default: 5.0,  min: 0.5}
  profit_take:      {type: float, default: 0.50, min: 0.05, max: 1.0}

legs:
  - {id: short_put,  right: P, qty: -1, expiry: {dte: {target: 0, tolerance: 0}},
                                        strike: {delta: "{{short_put_delta}}"}}
  - {id: long_put,   right: P, qty: 1,  expiry: {same_as: short_put},
                                        strike: {offset: {base: short_put, points: "-{{wing_width}}"}}}
  - {id: short_call, right: C, qty: -1, expiry: {same_as: short_put},
                                        strike: {delta: "{{short_call_delta}}"}}
  - {id: long_call,  right: C, qty: 1,  expiry: {same_as: short_put},
                                        strike: {offset: {base: short_call, points: "{{wing_width}}"}}}

entry:
  trigger: {time_of_day: "09:45", tz: America/New_York}
  filters: [{no_open_position: true}]

management:
  - {profit_target: {pct_of_credit: "{{profit_take}}"}, action: close}
  - {underlying_touch: {leg: short_put},  action: close}
  - {underlying_touch: {leg: short_call}, action: close}
  - {time_of_day: "15:45", action: force_flat}
