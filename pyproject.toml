[project]
name = "options-live-validator"
version = "0.1.0"
description = "Streaming paper-trading validator and 0DTE chain recorder for QQQ options strategies"
requires-python = ">=3.11"
# No pricing math lives in this repo (docs/IMPLEMENTATION_PLAN.md section 14).
# The Black-Scholes module, the tau clock and the strategy DSL are imported from
# options-backtest-lab.
dependencies = [
    # Pinned to a tag, never a branch: this carries obl.timebase, the *shared*
    # tau clock. Section 3 makes an identical clock in both repos a hard
    # requirement, and a floating ref would let it drift without a diff here.
    # Changing this pin can move every delta-selected strike, so treat a bump as
    # a modelling change and re-check tests/test_shared_clock.py.
    "options-backtest-lab @ git+https://github.com/npComplete21/options-backtest-lab@v0.2.0",
    "confluent-kafka",          # section 11: industry-standard client, replaces kafka-python
    "polars",                   # matches backtest-lab's stack
    "pyarrow",                  # Parquet archive
    "duckdb",                   # analytical queries over the archive
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml",
    "pandas_market_calendars",  # session boundaries identical to backtest-lab
    "python-dotenv",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires a running Kafka broker (docker compose up -d)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
